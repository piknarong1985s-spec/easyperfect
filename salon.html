<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy &amp; Perfect Salon – จองคิวและระบบหลังบ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffafb;--surface:#fff;--ink:#16302e;--mute:#5d706e;--line:#e5dcd6;--brand:#1c1c1c;--onbrand:#fff;--blush:#f7cdd5;--brass:#b03a5c;--danger:#b3372f;--ok:#237a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171416;--surface:#221d20;--ink:#f5ecee;--mute:#b5a4a9;--line:#3a3135;--brand:#f7cdd5;--onbrand:#1c1c1c;--blush:#3a2a30;--brass:#f08fa8;--danger:#ff8a80;--ok:#6fd49b}}
:root[data-theme="dark"]{--bg:#171416;--surface:#221d20;--ink:#f5ecee;--mute:#b5a4a9;--line:#3a3135;--brand:#f7cdd5;--onbrand:#1c1c1c;--blush:#3a2a30;--brass:#f08fa8;--danger:#ff8a80;--ok:#6fd49b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 'Noto Sans Thai',system-ui,sans-serif}
h1,h2,h3{font-family:'Mitr','Noto Sans Thai',sans-serif;font-weight:500;line-height:1.3;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:10px;padding:10px 20px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--line)}
header.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:960px;margin:0 auto}
.logo{font-family:'Mitr',sans-serif;font-size:22px;color:var(--ink);text-decoration:none}
.hero{background:var(--blush);color:var(--ink);padding:64px 0 56px}
.hero h1{font-size:clamp(34px,8vw,64px);max-width:11em}
.hero p{max-width:32em;margin:16px 0 28px}
.hero .grid{display:grid;gap:28px;align-items:center}@media(min-width:760px){.hero .grid{grid-template-columns:1.1fr 1fr}}.hero img.shop{width:100%;border-radius:16px;border:3px solid var(--ink)}.logo{display:flex;align-items:center;gap:10px}.logo img{width:40px;height:40px;border-radius:50%}.info{display:grid;gap:8px}.info a{color:var(--brass);font-weight:600}
section.blk{padding:48px 0}
section.blk>.wrap>h2{font-size:28px;margin-bottom:20px}
.menu{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.menu li{display:flex;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.menu .n{flex:1;font-weight:500}.menu small{color:var(--mute);display:block;font-weight:400}
.menu .p{font-family:'Mitr',sans-serif;color:var(--brass);white-space:nowrap}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.team div{background:var(--blush);border-radius:14px;padding:16px}
.team b{display:block}.team span{color:var(--mute);font-size:14px}
form.book{display:grid;gap:14px;max-width:520px}
label{display:grid;gap:4px;font-weight:500;font-size:15px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:center}
.slot[aria-pressed=true]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:10px;background:var(--blush)}
.rev{padding:14px 0;border-bottom:1px solid var(--line)}.rev p{margin:4px 0}.rev small{color:var(--mute)}.stars{color:var(--brass);letter-spacing:2px}textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:90px;font:inherit;color:inherit}a.btn{display:inline-block;text-decoration:none}form.rf{display:grid;gap:12px;max-width:520px;margin-top:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 16px;cursor:pointer}.chip[aria-pressed=true]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.ph{padding:0;border:0;background:none;cursor:pointer;border-radius:12px;overflow:hidden;aspect-ratio:1}.ph img{width:100%;height:100%;object-fit:cover;display:block}.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;color:#fff}.lb img{max-width:100%;max-height:75vh;border-radius:8px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px}.thumbs figure{margin:0;display:grid;gap:6px;align-content:start}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
footer{padding:28px 0;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
footer a{color:inherit}
/* admin */
.adm{padding:8px 0 48px}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--mute);font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brass)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:500 28px 'Mitr',sans-serif}.stat span{color:var(--mute);font-size:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px}
th{color:var(--mute);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.row input{flex:1;min-width:120px}
.tag{padding:2px 10px;border-radius:99px;font-size:13px;background:var(--blush)}
.tag.done{color:var(--ok)}.tag.cancel{color:var(--danger)}
.login{max-width:320px;margin:48px auto;display:grid;gap:12px}
.empty{color:var(--mute);padding:20px 0}
</style>
</head>

async function api(path,o={}){
 const h={apikey:KEY,'Content-Type':'application/json'};
 if(o.auth){const t=await token();if(!t)throw new Error('auth');h.Authorization='Bearer '+t}
 if(o.prefer)h.Prefer=o.prefer;
 const r=await fetch(SB+'/rest/v1/'+path,{method:o.method||'GET',headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body)});
 if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const e=new Error(m||('HTTP '+r.status));e.status=r.status;throw e}
 const t=await r.text();return t?JSON.parse(t):null;
}

function drawSlots(){

function sum(){

 D.bookings.filter(b=>b.status==='done').forEach(b=>{const k=b.date.slice(0,7),r=m[k]||(m[k]={n:0,cash:0,tr:0,none:0}),a=amt(b);r.n++;if(b.pay==='เงินสด')r.cash+=a;else if(b.pay==='โอน')r.tr+=a;else r.none+=a});

 if(!ks.length)return '<div class="empty">ยังไม่มีรายได้ให้สรุป รายการจะนับเมื่อสถานะเป็น เสร็จสิ้น หรือบันทึกจากแท็บ Walk-in</div>';

 const T=ks.reduce((t,k)=>({n:t.n+m[k].n,cash:t.cash+m[k].cash,tr:t.tr+m[k].tr,none:t.none+m[k].none}),{n:0,cash:0,tr:0,none:0});
 const row=(l,r,b)=>`<tr${b?' style="font-weight:600"':''}><td>${l}</td><td>${r.n}</td><td>${baht(r.cash)}</td><td>${baht(r.tr)}</td><td>${baht(r.none)}</td><td>${baht(r.cash+r.tr+r.none)}</td></tr>`;
 return `<p class="empty" style="padding-top:0">นับเฉพาะรายการที่เสร็จสิ้นแล้ว ถ้าไม่ได้เลือกวิธีชำระ ยอดจะอยู่ในช่อง ไม่ระบุ (เลือกได้ในแท็บ การจอง)</p><div class="scroll"><table><tr><th>เดือน</th><th>รายการ</th><th>เงินสด</th><th>โอน</th><th>ไม่ระบุ</th><th>รวม</th></tr>${ks.map(k=>row(lab(k),m[k])).join('')}${row('รวมทั้งหมด',T,1)}</table></div>`;
}
